---
layout: default
---
{% assign category = site.data.categories | where: "slug", page.category | first %}

<article class="category">
  <h1>{{ page.title }}</h1>

  <div class="category-summary">
    {{ category.summary }}
  </div>

  <div class="page-with-toc">
    {% include toc.html %}
    <div class="page-with-toc__content">
      {{ content }}
    </div>
  </div>

  {% comment %} Directory entries will loop in here {% endcomment %}
</article>

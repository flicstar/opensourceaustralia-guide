  summary: A community event for users of the Joomla content management system.
  description: |
    JoomlaDay is a community event for users of [Joomla](https://www.joomla.org/), an open source content management system.

- slug: kubernetes-community-days-australia
  name: Kubernetes Community Days Australia (KCD)
  url: https://community.cncf.io/kcd-australia/
  type: conferences
  status: active
  tags:
    - foss
  summary: Community-run conferences on Kubernetes and cloud native technology.
  description: |
    Community-run conferences on [Kubernetes](https://kubernetes.io/) and cloud native technology, organised under the [Cloud Native Computing Foundation](https://www.cncf.io/). Australian editions have been held in Sydney and Melbourne.

- slug: linux-conf-au
  name: linux.conf.au
  url: https://linux.org.au/linux-conf-au/
  type: conferences
  status: retired
  organisation_slug: linux-australia
  tags:
    - foss
  summary: The premier Linux and open source conference for Australia and New Zealand from 1999 to 2022.
  description: |
    linux.conf.au (LCA) was the premier Linux and open source conference for Australia and New Zealand for over two decades. It ran nearly every year from 1999 to 2022, moving to a different city each time, and was entirely volunteer-run. The format spanned five days: two days of miniconfs (special-interest tracks), followed by three days of main-conference talks. It evolved into the [Everything Open](#everything-open) conference.

    Sessions from past events are available to watch on the [Linux.conf.au YouTube channel](https://www.youtube.com/@linuxconfau/playlists).

- slug: resbaz
  name: ResBaz
  url: https://github.com/resbaz
  type: conferences
  status: active
  tags:
    - open-science
    - open-data
  summary: A three-day festival of digital research skills.
  description: |
    Research Bazaar (ResBaz) is a three-day festival of digital research skills. It's a highly participatory event where researchers from many disciplines learn practical tools and techniques like programming, data analysis, reproducible workflows, open science and research communication.

    ResBaz started at the University of Melbourne in 2015. It now runs as separate state-based editions. Teaching materials from past events are [published openly on GitHub](https://github.com/resbaz/lessons).

- slug: osdc
  name: Open Source Developers' Conference (OSDC)
  url: https://en.wikipedia.org/wiki/Open_Source_Developers%27_Conference
  type: conferences
  status: retired
  tags:
    - foss
  summary: A not-for-profit conference for open source developers in Australasia.
  description: |
    The Open Source Developers' Conference was a not-for-profit conference for open source developers in Australasia, organised around a range of programming languages such as Perl, Python, PHP, Ruby and Java, along with open source databases and version control systems.

    Founded in Melbourne in 2004, no OSDC has been held since 2015, and the association behind it merged into [Linux Australia](/organisations#linux-australia).

- slug: wordcamps-australia
  name: WordCamps Australia
  url: https://wpaustralia.org/events/
  type: conferences
  status: active
  tags:
    - foss
  summary: Community conferences about WordPress, held in cities around Australia.
  description: |
    Community conferences about [WordPress](https://en-au.wordpress.org/), the software behind a large share of the world's websites. Each one is organised locally, so the host city changes, and they cater to everyone from complete beginners through to professional developers.

- slug: wikicon-australia
  name: WikiCon Australia
  url: https://wikimedia.org.au/wiki/WikiCon_Australia
  type: conferences
  status: active
  organisation_slug: wikimedia-australia
  tags:

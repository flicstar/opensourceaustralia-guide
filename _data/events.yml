# Conferences

- slug: everything-open
  name: Everything Open
  url: https://everythingopen.au
  type: conferences
  status: active
  organisation_slug: linux-australia
  tags:
    - everything-open
    - foss
  summary: Australia's main conference for open technologies.
  description: |
    Australia's main conference for open technologies. Across three days it covers open source software, open hardware, open data, open government, the GLAM sector, and open communities. This is an annual conference, and is volunteer-run.

    Born out of [linux.conf.au (LCA)](#linux-conf-au), the premier Linux and open source conference for Australia and New Zealand from 1999 to 2022, Everything Open started in 2023 to broaden those connections beyond Linux.

    Sessions from past events are available to watch on the [Everything Open YouTube channel](https://www.youtube.com/@EverythingOpen).

- slug: foss4g-sotm-oceania
  name: FOSS4G SotM Oceania
  url: https://osgeo-oceania.org/events/
  type: conferences
  status: inactive
  organisation_slug: osgeo-oceania
  tags:
    - foss
    - open-data
  summary: The Australia, New Zealand and Pacific regional conference for open source mapping and geospatial technology.
  description: |
    The Australia, New Zealand and Pacific annual conference for open source mapping and geospatial technology. [Free and Open Source Software for Geospatial](https://foss4g.org/) (FOSS4G) is the open software and libraries to do geospatial analysis and make maps. [State of the Map](https://stateofthemap.org/) (SotM) focuses on using and contributing to OpenStreetMap.

- slug: pycon-au
  name: PyCon AU
  url: https://pycon.org.au
  type: conferences
  status: active
  organisation_slug: linux-australia
  tags:
    - foss
  summary: The national conference for everyone using the Python Programming Language.
  description: |
    PyCon AU is the national conference for people using the [Python Programming Language](https://www.python.org/). Hosted annually since 2010, this event brings the national and international Python community together. PyCon AU deliberately mixes first-time and experienced presenters. The programme usually combines free workshops, several days of main-conference talks with specialist tracks, and development sprints where attendees contribute directly to open source projects.

    Sessions from past events are available to watch on the [PyCon AU YouTube channel](https://www.youtube.com/user/PyConAU).

- slug: drupal-south
  name: DrupalSouth
  url: https://drupalsouth.org/
  type: conferences
  status: active
  tags:
    - foss
  summary: The Drupal conference for Australia and New Zealand.
  description: |
    DrupalSouth is the trans-Tasman regional conference for [Drupal](https://new.drupal.org/), an open source content management system. It usually includes a contribution day where attendees work on Drupal. The event location alternates between Australia and New Zealand. DrupalSouth also runs DrupalGov events aimed at the public sector agencies that use Drupal to build and run their websites; as well as community events like [DrupalSouth Community Day](https://drupalsouth.org/events/drupalsouth-community-day-2026).

    Sessions from past events are available to watch on the [DrupalSouth YouTube channel](https://www.youtube.com/user/DrupalSouth).

- slug: auigf
  name: auIGF
  url: https://auigf.au
  type: conferences
  status: active
  tags:
    - internet-governance
  summary: The annual Australian forum on internet public policy.
  description: |
    Formerly known as NetThing, the Australian Internet Governance Forum (auIGF) is an annual gathering where people from government, industry, civil society, academia and the technical community discuss public policy questions about the internet in Australia. It is modelled on the global [Internet Governance Forum](https://www.intgovforum.org/en) and uses the same multi-stakeholder approach, meaning no single sector sets the agenda.

    The programme is built from session proposals submitted by the community and forum is volunteer-run. It's co-hosted by [Internet Australia](https://www.internet.org.au/), the Australian chapter of the Internet Society. Read more about the event, including a brief history, from the [.au Domain Administration (auDA)](https://www.auda.org.au/news-insights/events/australian-internet-governance-forum-auigf/).

- slug: rseaa
  name: Research Software Asia Australia Conference (RSEAA)
  url: https://rseaa.org/
  type: conferences
  status: active
  tags:
    - open-research
    - foss
  summary: An online conference for people who build and maintain research software.
  description: |
    An annual online conference for people who build and maintain software for research - research software engineers (RSE). It's a joint event between the [RSE Asia Association](https://rse-asia.github.io/RSE_Asia/) and the [RSE Association of Australia and New Zealand](https://rse-aunz.org/)

- slug: australian-repair-summit
  name: Australian Repair Summit
  url: https://www.griffith.edu.au/arts-education-law/griffith-law-school/research/australian-repair-network
  type: conferences
  status: inactive
  organisation_slug: australian-repair-network
  tags:
    - right-to-repair
    - open-hardware
  summary: A one-day gathering on the right to repair the things you own.
  description: |
    A one-day gathering that brings repair businesses, consumer advocates, researchers, industry bodies and government together to discuss the right to repair. The first summit was held in 2021 and has runs annually.

    Sessions from the 2025 event are available to [watch online](https://events.griffith.edu.au/event/c73c75df-a339-45df-9ec4-e06506d4d380/program-videos).

- slug: eresearch-australasia
  name: eResearch Australasia
  url: https://conference.eresearch.edu.au
  type: conferences
  status: active
  tags:
    - open-data
    - open-research
  summary: The conference for the people and infrastructure behind digital research.
  description: |
    The main conference for the people and infrastructure behind digital research: data specialists, research software engineers, librarians, technologists, policy makers and industry partners. Hosted by [Australasian eResearch Organisations](https://www.aero.edu.au/) (AeRO), this is an institutional rather than community-run event for universities, national research infrastructure and funding bodies. The conference is broader than open source, but open source tools, open data and reproducible research methods feature throughout.

    Content from previous events is [available in their archive](https://conference.eresearch.edu.au/archive/).


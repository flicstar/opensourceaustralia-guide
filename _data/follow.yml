# Books

- slug: lions-commentary-on-unix
  name: Lions' Commentary on UNIX 6th Edition, with Source Code
  url: https://en.wikipedia.org/wiki/Lions%27_Commentary_on_UNIX_6th_Edition,_with_Source_Code
  type: books
  status: active
  added: 2026-11
  verified: 2026-11
  tags:
    - academic
    - foss
  description: |
    John Lions taught computing at UNSW and wrote this walkthrough of the UNIX source code in 1977. Licensing restrictions meant it couldn't be taught or distributed, so it circulated as photocopies for two decades before it could be republished in 1996. It is a founding text in the argument that you learn to write software by reading it.

- slug: practical-arduino
  name: "Practical Arduino: Cool Projects for Open Source Hardware"
  url: https://www.oreilly.com/library/view/practical-arduino-cool/9781430224778/
  type: books
  status: active
  tags:
    - open-hardware
  description: |
    Jonathan Oxer and Hugh Blemings walk through a series of Arduino builds, each one a complete project with circuit, code and explanation. Published by Apress in 2009, so some components have moved on, but the approach to designing and documenting an open hardware project still holds up.

# Blogs

- slug: planet-linux-australia
  name: Planet Linux Australia
  url: https://planet.luv.asn.au/
  type: blogs
  status: active
  tags:
    - community
    - foss
  description: |
    A planet is an aggregator: a site that pulls in the feeds from a group of blogs and shows the posts together, newest first. This one gathers around blogs from Australian and New Zealand open source people, plus Linux Australia's own announcements. It's hosted by [Linux Users of Victoria](https://www.luv.asn.au/).


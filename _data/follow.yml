# Books

- slug: lions-commentary-on-unix
  name: Lions' Commentary on UNIX 6th Edition, with Source Code
  url: https://en.wikipedia.org/wiki/Lions%27_Commentary_on_UNIX_6th_Edition,_with_Source_Code
  type: books
  status: active
  tags:
    - academic
    - foss
  description: |
    John Lions taught computing at UNSW and wrote this walkthrough of the UNIX source code in 1977. Licensing restrictions meant it couldn't be taught or distributed, so it circulated as photocopies for two decades before it could be republished in 1996. It is a founding text in the argument that you learn to write software by reading it.


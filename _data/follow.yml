  name: Exploring the Open Source Landscape in Australia
  url: https://www.youtube.com/watch?v=UmkdhT1AR2Q
  type: videos
  status: active
  tags:
    - community
    - foss
    - glam
  description: |
    A talk by Sae Ra Germaine, recorded for [Data Umbrella](https://www.youtube.com/@DataUmbrella) in 2023. The presentation covers what it's like to do open source from Australia, touches on several notable open source projects in Australia and New Zealand, and the role of Linux Australia. Data Umbrella is a global community for people in data science and open source.
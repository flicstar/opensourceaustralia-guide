    - open-hardware
  description: |
     A network based at Griffith University that brings together universities, not-for-profits, industry associations, consumer groups and repairers to promote the right to repair in Australia. It engages with government and industry on the legislative and policy changes responding to the international right to repair movement, and runs forums and the [Australian Repair Summit](https://opensourceaustralia.guide/events#australian-repair-summit).


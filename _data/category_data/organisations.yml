# Umbrella and backing bodies

- slug: linux-australia
  name: Linux Australia
  url: https://linux.org.au/
  type: umbrella
  status: active
  tags:
    - community
    - events
    - open-source-software
  description: |
    The peak body for open source communities in Australasia. It supports conferences, events and community projects, holding funds and providing organisational backing for volunteer-run activities. It also runs an annual grants program for open source, open data, open hardware and open culture work.

    Founded in 1997, Linux Australia is a non-profit organisation run by volunteers and governed by a council elected by members each year. Membership is free. See more on the [Wikipedia page](https://en.wikipedia.org/wiki/Linux_Australia).

- slug: osgeo-oceania
  name: OSGeo Oceania
  url: https://osgeo-oceania.org/
  type: umbrella
  status: active
  tags:
    - community
    - events
  description: |
    The regional chapter of the [Open Source Geospatial Foundation](https://www.osgeo.org/), covering Australia, New Zealand and the Pacific. OSGeo Oceania is a volunteer organisation devoted to growing and enabling the [OpenStreetMap](https://www.openstreetmap.org/about) and Open Source Geospatial communities in Oceania.

# Infrastructure

- slug: anzlic
  name: ANZLIC
  url: https://www.anzlic.gov.au/
  type: infrastructure
  status: active
  tags:
    - government
    - open-standards
  description: |
    The Spatial Information Council (formerly the Australia and New Zealand Land Information Council). It is an intergovernmental organisation that sets the shared rules that let government spatial data be found, trusted and reused across state, territory and national borders. It maintains the [metadata standards](https://www.anzlic.gov.au/resources/asnzs-iso-1911512015-metadata) that describe what a dataset is and where it came from so anyone publishing spatial data can check their records against the standard.

    ANZLIC also sponsors the [Foundation Spatial Data Framework](https://www.anzlic.gov.au/archiveresource-archive/foundation-spatial-data-framework), which defines the core data themes, like addresses, elevation and land cover, that everything else is built on. The technical delivery is done by agencies, mostly [Geoscience Australia](#geoscience-australia).

- slug: australian-research-data-commons
  name: Australian Research Data Commons (ARDC)
  url: https://ardc.edu.au/
  type: infrastructure
  status: active
  tags:
    - academic
    - open-data
  description: |
    A national research data infrastructure facility that supports the management, preservation, and sharing of research data across Australian universities and research institutions.

- slug: data61
  name: CSIRO's Data61
  type: infrastructure
  status: inactive
  tags:
    - government
  description: |
    Australia's national digital and data research group, formed in 2016 by merging [National ICT Australia (NICTA)](https://en.wikipedia.org/wiki/NICTA) with CSIRO's [Digital Productivity Flagship](https://open-ecosystem.org/partners/csiro-digital-productivity-services-flagship-dpas). The name combined Australia's country calling code with a focus on data science. It worked on AI, robotics, cybersecurity and software engineering, and built the technical standards for the Consumer Data Right. CSIRO [dissolved the brand in April 2026](https://csirostaff.org.au/news/2026/04/30/csiro-pulls-the-plug-on-data61-with-manufacturing-amalgamation/) and folded the unit into a new Technology research unit alongside manufacturing.

    Its source code remains at [CSIRO Data61 Engineering & Design](https://github.com/data61) on GitHub.

- slug: geoscience-australia
  name: Geoscience Australia
  url: https://www.ga.gov.au/
  type: infrastructure
  status: active
  tags:
    - government
    - open-data
  description: |
    The Australian Government's geoscience agency is the national custodian of Australia's geographic and geological data. It releases its material under a Creative Commons Attribution licence, is the largest contributor to [data.gov.au](https://opensourceaustralia.guide/open-data#data-gov-au) and publishes its own holdings through the  [Geoscience Australia Portal](https://opensourceaustralia.guide/open-data#geoscience-australia-portal). It builds what [ANZLIC](#anzlic) sets the standards for, including the [Digital Atlas of Australia](#digital-atlas-of-australia). Its Digital Earth Australia platform, which lets you browse satellite imagery, runs on  open source software, [Open Data Cube](https://www.opendatacube.org/). See more on the [Wikipedia page](https://en.wikipedia.org/wiki/Geoscience_Australia).

- slug: integrated-marine-observing-system
  name: Integrated Marine Observing System (IMOS)
  url: https://imos.org.au/
  type: infrastructure
  status: active
  tags:
    - academic
    - open-data
  description: |
    A national research infrastructure facility that has been operating a wide range of observing equipment throughout Australia's coastal and open oceans since 2006. IMOS makes all of its data openly and freely accessible through the [Australian Ocean Data Network](https://opensourceaustralia.guide/open-science#australian-ocean-data-network) portal.


- slug: australian-government-linked-data-working-group
  name: Australian Government Linked Data Working Group (AGLDWG)
  url: https://www.linked.data.gov.au/
  type: infrastructure
  status: active
  tags:
    - government
    - open-standards
  description: |
    A group of Commonwealth government staff and researchers, established in 2012, working on linked data, a set of open web standards for publishing data so that every term in it points to a published definition. The group writes guidance for agencies on using those standards, and publishes the resulting vocabularies and definitions under an open licence, so anyone can reuse them.

# Builders

- slug: opensi
  name: OpenSI
  url: https://opensi.net/
  type: builders
  status: active
  tags:
    - academic
    - open-source-ai
  description: |
    A non-profit institute at the University of Canberra supporting open source technologies in research, development, education and implementation. Its research covers four themes: data solutions at scale, cyber security and privacy, artificial intelligence and machine learning, and open source business models. OpenSI works with students and researchers through higher degree research scholarships, semester and part-time projects, capstone and sponsored projects, and paid internships.

    The research philosophy is grounded in the principles of [open science](https://opensourceaustralia.guide/open-science), and successful projects are donated and transferred to open source communities for ongoing development. Its code is published at [TheOpenSI](https://github.com/TheOpenSI) on GitHub.

- slug: trustworthy-systems
  name: Trustworthy Systems
  url: https://trustworthy.systems/
  type: builders
  status: active
  tags:
    - academic
  description: |
    A research group at [UNSW Sydney](https://www.unsw.edu.au/engineering/our-schools/computer-science-and-engineering/our-research/research-groups/trustworthy-systems) that builds software with mathematical proofs of its security, safety and reliability. Best known for [seL4](https://opensourceaustralia.guide/open-source-software#sel4), the first operating system kernel proven correct from high-level security properties down to the compiled binary. The group started at NICTA, moved into [CSIRO's Data61](#data61), and returned to UNSW in 2021 after Data61 cut its funding. Most of its software is released open source at [github.com/au-ts](https://github.com/au-ts/), and projects move to the seL4 Foundation's repositories once the foundation adopts them.

- slug: computerbank-victoria
  name: Computerbank Victoria
  url: https://www.computerbank.org.au/
  type: builders
  status: active
  tags:
    - community
  description: |
    Computerbank is a Melbourne not for profit organisation that has been refurbishing donated computers since 1998. Skilled volunteers install Linux and useful software, and the machines go to concession card holders, community groups and not-for-profits at low cost.

- slug: olpc-australia
  name: One Laptop Per Child (OLPC) Australia
  type: builders
  status: inactive
    - community
    - open-hardware
    - education
  description: |
    The Australian arm of [One Laptop per Child](https://en.wikipedia.org/wiki/One_Laptop_per_Child), the project behind the XO laptop. It was announced at [linux.conf.au](https://opensourceaustralia.guide/events#linux-conf-au) in January 2008 and launched in March that year.

    OLPC Australia put XO laptops into remote and disadvantaged schools, and released open source work of its own. XO-AU was the Australian build of the XO software and content, customized for local schools and communities. XS-AU was a reconfigured school server. A mini update server let one XO update others over wifi, and a charging rack came with a charger designed in-house.

    Development was coordinated at dev.laptop.org.au, now offline. OLPC rebranded in 2012 as One Education, which sells a laptop called the Infinity and no longer describes its work as open source. OLPC Australia's website is preserved on the [Internet Archive](https://web.archive.org/web/20130420043409/https://www.laptop.org.au/).

- slug: superpower-institute
  name: The Superpower Institute
  url: https://www.superpowerinstitute.com.au/
  type: builders
  status: active
  tags:
    - open-data
  description: |
    A Melbourne non-profit that builds free, open-source platforms that fill gaps in Australia's climate and energy data, including [Open Electricity](https://opensourceaustralia.guide/open-data#open-electricity) and [Open Methane](https://opensourceaustralia.guide/open-data#open-methane).

- slug: openaustralia-foundation
  name: OpenAustralia Foundation
  url: https://www.openaustraliafoundation.org.au/
  type: builders
  status: active
  tags:
    - community
    - open-data
  description: |
    An Australian charity that builds and runs [civic tech](https://opensourceaustralia.guide/open-data#civic-tech) projects using public government data.

- slug: ozlabs
  name: OzLabs
  url: https://ozlabs.org/
  type: builders
  status: inactive
  tags:
    - industry
    - open-source-software
  description: |
    A collective of Australian free and open source software developers, formed in Canberra in 1999 and closely partnered with IBM for roughly 25 years. Members worked on the Linux kernel's PowerPC port, Samba, rsync, KVM for Power, Skiboot, Petitboot and OpenBMC. The association with IBM ended in January 2026, though many members continue working in open source elsewhere. The OzLabs [About page](https://ozlabs.org/about.html) has the full history.

    Rusty Russell founded [linux.conf.au](https://opensourceaustralia.guide/events#linux-conf-au) while at OzLabs.

- slug: wikimedia-australia
  name: Wikimedia Australia
  url: https://wikimedia.org.au/
  type: builders
  status: active
  tags:
    - community
    - glam
    - events
  description: |
    The Australian chapter of the international [Wikimedia Foundation](https://wikimediafoundation.org/), and an independent charitable organisation. It supports people and organisations to contribute to Wikipedia, Wikidata and other Wikimedia platforms through events, training and partnerships.

# Communities and event organisations

- slug: electron-workshop
  name: Electron Workshop
  url: https://electronworkshop.org/
  type: communities
  status: active
  tags:
    - community
    - events
  description: |
    A peer network connecting community groups, non-profits, and individuals working in the open source and innovation commons space.

- slug: melbourne-tech-guilds
  name: Melbourne Tech Guilds
  url: https://techguilds.au/
  type: communities
  status: active
  tags:
    - community
    - open-hardware
  description: |
    Melbourne Tech Guilds is a maker community that started in December 2025. It meets on the first Sunday of the month and splits into five interest groups: robotics, mechanics, IoT, coding and deep dive. Projects run on open hardware and open tooling, mostly Arduino, ESP32 and Raspberry Pi, with Home Assistant and MQTT on the IoT side. Mentoring is free and the group is non-commercial.

# Open access and open science

- slug: australian-open-science-network
  name: Australian Open Science Network
  url: https://caul.edu.au/external-groups/australian-open-science-network/
  type: open-science
  status: active
  tags:
    - academic
    - open-science
  description: |
    A forum where Australia's major research bodies exchange information on open science, advocate for it, and coordinate the country's response to international initiatives like the [UNESCO Open Science Recommendation](https://www.unesco.org/en/open-science). It is co-convened by [CAUL](#caul), [Open Access Australasia](#open-access-australasia) and the [ARDC](#australian-research-data-commons).

- slug: caul
  name: Council of Australasian University Librarians (CAUL)
  url: https://caul.edu.au/
  type: open-science
  status: active
  tags:
    - academic
    - open-access
  description: |
    A membership body for university libraries across Australia and New Zealand, and a registered charity. CAUL leads initiatives to increase open access to research outputs through content procurement, policy development and advocacy, and runs the CAUL Consortium, which negotiates read-and-publish agreements with publishers on behalf of member institutions. It also runs the [Open Educational Resources Collective](https://oercollective.caul.edu.au/catalogue/), a catalogue of free peer-reviewed open textbooks. CAUL co-convenes the [Australian Open Science Network](#australian-open-science-network).

- slug: open-access-australasia
  name: Open Access Australasia (OAA)
  url: https://oaaustralasia.org/
  type: open-science
  status: active
  tags:
    - open-access
  description: |
    A membership organisation advocating for open scholarship across Australia and New Zealand, formerly the Australasian Open Access Strategy Group. Its scope covers the whole research and education landscape, including open access publishing, open data, open educational resources and other open practices. OAA makes submissions to government consultations, sometimes jointly with [CAUL](#caul), and co-convenes the [Australian Open Science Network](#australian-open-science-network).


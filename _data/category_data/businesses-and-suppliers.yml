    Catalyst IT Australia hosts, customises and supports Moodle, Mahara, Totara, Drupal, GovCMS and Koha, with custom development, system integration, load testing and LMS migration. Most of its work is with education providers, government agencies and not-for-profits.

- slug: medeopolis
  name: Medeopolis
  url: https://medeopolis.com.au/
  type: learning-and-collection-systems
  based_in: Hobart, TAS
  services:
    - development
    - migration
    - hosting

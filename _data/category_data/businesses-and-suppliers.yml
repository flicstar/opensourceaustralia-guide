  description: |
    Medeopolis works with collection and archive systems including CollectiveAccess, AtoM, Archivematica and Omeka S, along with Django, Wagtail and Tendenci, covering development, data migration, managed Australian hosting, systems administration and training. Everything it offers is released under an OSI-approved licence. Its collections work runs through [GLAM IT Systems](https://glamit.systems/) for archives, museums, universities and historical societies.


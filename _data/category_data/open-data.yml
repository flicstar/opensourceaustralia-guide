     Dateno is a search engine built specifically to run over open data sets around the world, and it includes some Australian datasets. 

# Civic tech

- slug: "openaustralia"
  name: "OpenAustralia"
  url: "https://www.openaustralia.org.au/"
  type: "civic-tech"
  sort_key: "010"
  status: "active"
  run_by: "openaustralia-foundation"
  description: "Publishes Hansard records for the House of Representatives and the Senate, going back to 2006. Written questions, petitions, divisions and committee records are not included."

- slug: "they-vote-for-you"
  name: "They Vote For You"
  url: "https://theyvoteforyou.org.au/"
  type: "civic-tech"
  sort_key: "020"
  status: "active"
  run_by: "openaustralia-foundation"
  description: "Shows how your MP has voted on any issue, in language designed to be readable without prior knowledge of parliamentary procedure."

- slug: "right-to-know"
  name: "Right To Know"
  url: "https://www.righttoknow.org.au/"
  type: "civic-tech"
  sort_key: "030"
  status: "active"
  run_by: "openaustralia-foundation"
  description: "Helps you submit a Freedom of Information request. Requests and responses are published and archived."

- slug: "planningalerts"
  name: "PlanningAlerts"
  url: "https://www.planningalerts.org.au/"
  type: "civic-tech"
  sort_key: "040"
  status: "active"
  run_by: "openaustralia-foundation"
  description: "A searchable collection of Australian local government planning applications, so you can see what is being built and knocked down near you."

# GLAM

- slug: "glam-workbench"
  name: "GLAM Workbench"
  url: "https://glam-workbench.net/"
  type: "glam"
  sort_key: "010"
  status: "active"
  description: |
    A maintained catalogue of Australian GLAM data sources, built by
    [Tim Sherratt](https://timsherratt.au/). Includes Trove, the National
    Library of Australia, and the Australian War Memorial among many others.

# Transport

- slug: "imove-transport-data-directory"
  name: "iMOVE Australia transport data directory"
  url: "https://imoveaustralia.com/transport-data-hub/" # [CHECK]
  type: "transport"
  sort_key: "010"
  status: "active"
  description: |
    A directory of Australian transport open data sources, with links to the
    portals run by each state and territory.

    Compiled by iMOVE Australia, a federally funded not-for-profit. This is an
    index of sources, not a data source itself.

# Geospatial and mapping

- slug: "elvis"
  name: "Elvis elevation and depth"
  url: "https://elevation.fsdf.org.au/" # [CHECK]
  type: "geospatial-and-mapping"
  sort_key: "010"
  status: "active"
  description: |
    Australian elevation and bathymetry data, searchable by area of interest.
    Brings together open data from Commonwealth, state and territory
    governments in one place.

    Developed by agencies participating in the Intergovernmental Committee on
    Surveying and Mapping.

- slug: "geoscience-australia-portal"
  name: "Geoscience Australia Portal"
  url: "https://portal.ga.gov.au/"
  type: "geospatial-and-mapping"
  sort_key: "020"
  status: "active"
  description: |
    Geoscientific data, maps and tools covering Australian resources, geology,
    groundwater and natural hazards.

    Geoscience Australia also runs the Digital Atlas of Australia, Digital
    Earth Australia and AusSeabed.

- slug: "openstreetmap-australian-data-sources"
  name: "OpenStreetMap Australian data sources"
  url: "https://wiki.openstreetmap.org/wiki/Australian_Data_Sources"
  type: "geospatial-and-mapping"
  sort_key: "030"
  status: "active"
  description: |
    A wiki page listing the open datasets that Australian OpenStreetMap
    contributors are permitted to use, along with the import catalogue and the
    state mapping projects.


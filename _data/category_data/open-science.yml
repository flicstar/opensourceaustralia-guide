# Research data collections

- slug: "atlas-of-living-australia"
  name: "Atlas of Living Australia"
  url: "https://www.ala.org.au/"
  type: "research-data-collection"
  sort_key: "010"
  status: "active"
  description: "Open digital infrastructure that brings Australian biodiversity data together from many sources into one accessible, reusable collection."

- slug: "aurin"
  name: "AURIN data catalogue"
  url: "https://data.aurin.org.au/"
  type: "research-data-collection"
  sort_key: "020"
  status: "active"
  description: |
    The Australian Urban Research Infrastructure Network. Holds health, transport, housing, economic, land use and demographic data for urban, regional and social science research.

    Most of the catalogue is openly licensed. A small number of datasets are restricted, and AURIN negotiates access to those on behalf of researchers. Each dataset lists its own [access group](https://data.aurin.org.au/group) and licence.

- slug: "australian-ocean-data-network"
  name: "Australian Ocean Data Network portal"
  url: "https://portal.aodn.org.au/"
  type: "research-data-collection"
  sort_key: "030"
  status: "active"
  description: |
    Australian marine and climate science data, and the main access point for data and metadata from the Integrated Marine Observing System.

    A rebuilt version of the portal is in beta at [portal-beta.aodn.org.au](https://portal-beta.aodn.org.au/).

- slug: "csiro-data-access-portal"
  name: "CSIRO Data Access Portal"
  url: "https://data.csiro.au/"
  type: "research-data-collection"
  sort_key: "040"
  status: "active"
  description: "Research data, software and other digital assets from Australia's national science agency, across a range of disciplines."

- slug: "soil-and-landscape-grid-of-australia"
  name: "Soil and Landscape Grid of Australia"
  url: "https://esoil.io/TERNLandscapes/Public/Pages/SLGA/"
  type: "research-data-collection"
  sort_key: "050"
  status: "active"
  description: "Consistent, nation-wide soil and landscape attribute data in a downloadable format."

- slug: "tern-data-discovery-portal"
  name: "TERN Data Discovery Portal"
  url: "https://portal.tern.org.au/"
  type: "research-data-collection"
  sort_key: "060"
  status: "active"
  description: "Environmental monitoring data from TERN, Australia's ecosystem observatory. The data supports terrestrial and coastal ecosystem science and environmental management."


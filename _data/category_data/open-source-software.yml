# Education

- slug: moodle
  name: Moodle
  url: https://moodle.org/
  type: education
  status: active
  description: |
    Learning management system created in 2001 by Martin Dougiamas, an Australian educator and computer scientist. He has written about [how it started](https://dougiamas.com/about/), and there is a [Moodle history page](https://docs.moodle.org/502/en/History) and [Moodle.com](https://moodle.com/?ref=dougiamas.com).

# Networking and file sharing

- slug: librsync
  name: librsync
  url: https://librsync.github.io/
  type: networking-and-file-sharing
  status: active
  description: |
    Library implementing the rsync delta algorithm, LGPL-2.1-or-later.

- slug: netfilter-and-iptables
  name: netfilter and iptables
  url: https://www.netfilter.org/
  type: networking-and-file-sharing
  status: active
  description: |
    Packet filtering in the Linux kernel, written by Rusty Russell in Canberra. The project is international now. Its predecessor, ipchains, is also Rusty's work.

- slug: rsync
  name: rsync
  url: https://rsync.samba.org/
  type: networking-and-file-sharing
  status: active
  description: |
    Copies and synchronises files efficiently by comparing what has changed. Also from Andrew Tridgell.

- slug: samba
  name: Samba
  url: https://www.samba.org/
  type: networking-and-file-sharing
  status: active
  description: |
    Lets Linux and Unix machines share files and services with Windows. Started by Andrew Tridgell in Canberra.


# Civic and community tools

- slug: civicrm-elections
  name: CiviCRM Elections extension
  url: https://github.com/agileware/au.com.agileware.elections
  type: civic-and-community-tools
  status: active
  description: |
    Adds instant-runoff voting to CiviCRM. Built by Agileware in Australia. See the [extension listing](https://civicrm.org/extensions/elections).

- slug: morph-io
  name: morph.io
  url: http://morph.io
  type: civic-and-community-tools
  status: inactive
  description: |
    Hosted web scraping service run by the Open Australia Foundation. They have written about the [current state of the project](https://oaf.org.au/2026/07/30/morph-io-is-stuck-in-2016-help-us-get-it-out/).

# Communications

- slug: codec2
  name: Codec2
  url: https://github.com/drowe67/codec2
  type: communications
  status: active
  description: |
    Low bit rate speech codec by David Rowe in Adelaide. Also FreeDV and the SM1000 hardware. More at [Rowetel](https://www.rowetel.com/).

- slug: freepbx
  name: FreePBX
  url: https://www.freepbx.org/
  type: communications
  status: active
  description: |
    Web interface for configuring Asterisk phone systems, written in 2004 by Australian programmer Rob Thomas as the Asterisk Management Portal. See [Wikipedia](https://en.wikipedia.org/wiki/FreePBX).

# Data and monitoring

- slug: grafana
  name: Grafana
  url: https://grafana.com/
  type: data-and-monitoring
  status: active
  description: |
    Observability and dashboard platform. Co-founder and CTO Anthony Woods is from Western Australia. Grafana Labs has written about [how it got here](https://grafana.com/blog/grafana-labs-at-5-how-we-got-here-and-where-were-going/) and made a [documentary](https://grafana.com/blog/the-story-of-grafana-documentary-from-one-developers-dream-to-20-million-users-worldwide/).


# Science and research

- slug: access-nri
  name: ACCESS-NRI
  url: https://www.access-nri.org.au/
  type: science-research
  status: active
  description: |
    Australia's climate simulator. ACCESS-NRI develops and supports the Australian Community Climate and Earth System Simulator, a set of models that simulate past, present and future climate, weather and Earth systems.

    Code is published at [access-nri](https://github.com/access-nri) on GitHub. Documentation and community support sit on [ACCESS-Hive](https://docs.access-hive.org.au/) and its [forum](https://forum.access-hive.org.au/).

    Hosted at ANU and run with the Bureau of Meteorology, CSIRO, the Australian Antarctic Division and five universities. Enabled by NCRIS. Given how often NCRIS shows up across the directory,(ARDC, AAF, ACCESS-NRI, TERN, AURIN), it's worth one entry somewhere. Your Government Procurement & Policy page is the honest fit, since it''s a funding mechanism rather than a project. One entry explaining what NCRIS is, then every other entry can just say “enabled by NCRIS” and link to it.

# Data and monitoring

- slug: open-data-cube
  name: Open Data Cube
  url: https://www.opendatacube.org/
  type: data-and-monitoring
  status: active
  description: |
    A set of Python libraries and a PostgreSQL database for working with satellite imagery and other geospatial raster data. It started at Geoscience Australia as the Australian Geoscience Data Cube, built with CSIRO and the National Computational Infrastructure to make the newly opened Landsat archive usable. Other countries wanted the same thing, so it became an international open source project. It now runs Digital Earth Australia and Digital Earth Africa, among others. Code on [GitHub](https://github.com/opendatacube).

- slug: grafana
  name: Grafana
  url: https://grafana.com/
  type: data-and-monitoring
  status: active
  description: |
    Observability and dashboard platform. Co-founder and CTO Anthony Woods is from Western Australia. Grafana Labs has written about [how it got here](https://grafana.com/blog/grafana-labs-at-5-how-we-got-here-and-where-were-going/) and made a [documentary](https://grafana.com/blog/the-story-of-grafana-documentary-from-one-developers-dream-to-20-million-users-worldwide/).

- slug: performance-co-pilot
  name: Performance Co-Pilot (PCP)
  url: https://pcp.io
  type: data-and-monitoring
  status: active
  description: |
    System performance monitoring and analysis toolkit. Designed at SGI in Melbourne and released as a commercial product in 1995. SGI re-released the core as free software and it now ships with the major Linux distributions. Much of the development work is still done in Australia. See [Wikipedia](https://en.wikipedia.org/wiki/Performance_Co-Pilot). See also https://www.wikiwand.com/en/Performance_Co-Pilot


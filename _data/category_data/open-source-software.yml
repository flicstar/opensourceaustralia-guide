- slug: samba
  name: Samba
  url: https://www.samba.org/
  type: networking-and-file-sharing
  status: active
  description: |
    Lets Linux and Unix machines share files and services with Windows. Started by Andrew Tridgell in Canberra.

- slug: lores-mesh
  name: LoRes Mesh
  url: https://lores.tech/
  type: networking-and-file-sharing
  status: active
  description: |
    Software for running a resilient local internet. A LoRes Node is a cluster of small low-powered computers, like Raspberry Pis, that hosts websites, email and other services for a local community. Nodes talk to each other over a peer-to-peer network, so they keep working when the internet or the power goes down. LoRes Mesh is currently used by [Merri-bek Tech](https://opensourceaustralia.guide/organisations#merri-bek-tech).

# Operating systems and firmware

- slug: xfs
  name: XFS
  url: https://xfs.org/
  type: operating-systems-and-firmware
  status: active
  description: |
    High performance journaling filesystem, now part of the Linux kernel. SGI formed a team in Melbourne to port XFS from IRIX to Linux and to run the encumbrance review that cleared it for release under the GPL in 2000. The team wrote up the work in a [2000 USENIX paper](https://www.usenix.org/conference/2000-usenix-annual-technical-conference/porting-sgi-xfs-file-system-linux), and LWN covered the history in [XFS: There and back and there again](https://lwn.net/Articles/638546/).

- slug: sel4
  name: seL4
  url: https://sel4.systems/
  type: operating-systems-and-firmware
  status: active
  description: |
    A microkernel with a complete mathematical proof that its code does what its specification says, down to the compiled binary. Developed in Australia by NICTA and UNSW, open sourced in 2014, and now maintained by the seL4 Foundation under the Linux Foundation. It runs in defence systems, autonomous vehicles and medical devices. The proofs are public too, which is rare for verification work at this scale. Still developed by [Trustworthy Systems](#trustworthy-systems) at UNSW.

- slug: openbmc
  name: OpenBMC
  url: https://www.openbmc.org/
  type: operating-systems-and-firmware
  status: active
  description: |
    Linux firmware stack for baseboard management controllers. Multi-vendor project with ongoing maintenance from the OzLabs team in Canberra. [Source](https://github.com/openbmc/openbmc).

- slug: puppy-linux
  name: Puppy Linux, Quirky and EasyOS
  url: https://bkhome.org/tag_linux.html
  type: operating-systems-and-firmware
  status: active
  description: |
    Lightweight Linux distributions created by Barry Kauler.


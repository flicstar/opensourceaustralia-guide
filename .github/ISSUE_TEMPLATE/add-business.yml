name: Add a business to the directory
description: Add your business to the businesses and suppliers page
title: "[Add business listing] Your business name"
labels: ["listing"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding your business. Everything here ends up on the public listing, so write it the way you want it read.

  - type: input
    id: name
    attributes:
      label: Business name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Website
      placeholder: https://example.com.au
    validations:
      required: true

  - type: input
    id: based_in
    attributes:
      label: Where you're based
      description: City then state. You need a presence in Australia to be listed.
      placeholder: Ballarat, VIC
    validations:
      required: true

  - type: checkboxes
    id: services
    attributes:
      label: Services you provide
      options:
        - label: Development
        - label: Migration
        - label: Hosting
        - label: Retail
        - label: Support
        - label: Training
        - label: Consulting
        - label: Something else

  - type: input
    id: services_other
    attributes:
      label: Other services
      description: Only if you ticked "Something else".

  - type: input
    id: projects
    attributes:
      label: Open projects and tools you work with
      description: We can't list a business that doesn't work with anything open.
      placeholder: Drupal, GovCMS, PostgreSQL
    validations:
      required: true

  - type: input
    id: sectors
    attributes:
      label: Who you usually work with
      placeholder: small business, local government, schools
    validations:
      required: true

  - type: textarea
    id: about
    attributes:
      label: About your business
      description: Two or three sentences in your own words. Plain description, not marketing copy.
    validations:
      required: true